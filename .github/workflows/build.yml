name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx3G

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: sol-client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
